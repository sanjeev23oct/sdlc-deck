<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skills for Coding Agents — Deck</title><style>*{box-sizing:border-box}body{margin:0;background:#060a10;color:white;font:16px Arial}#stage{height:calc(100dvh - 48px);display:flex;align-items:center;justify-content:center}iframe{width:100%;height:100%;border:0}nav{height:48px;display:flex;align-items:center;justify-content:center;gap:10px}button,select,a{font:14px Arial;color:white;background:#1d2d3b;border:1px solid #4c6172;padding:7px 12px;border-radius:4px;text-decoration:none}select{max-width:35vw}#next{background:#a7f06b;color:#142212}.tv nav{display:none}.tv #stage{height:100dvh}#exit{display:none;position:fixed;right:10px;bottom:8px;opacity:.2}.tv #exit{display:block}#exit:hover{opacity:1}</style></head><body><div id="stage"><iframe id="frame" title="Presentation slide"></iframe></div><nav><button id="prev">‹ Previous</button><span id="count"></span><button id="next">Next ›</button><select id="jump" aria-label="Choose slide"></select><button id="tv">TV mode</button><a id="edit" target="_blank">Open slide</a></nav><button id="exit">Exit TV mode</button><script src="slides.js"></script><script>let i=0;const frame=document.querySelector('#frame'),jump=document.querySelector('#jump');SLIDES.forEach((s,n)=>{const o=document.createElement('option');o.value=n;o.textContent=(n+1)+'. '+s.title;jump.append(o)});function show(n){i=Math.max(0,Math.min(SLIDES.length-1,n));frame.src=SLIDES[i].file;jump.value=i;document.querySelector('#count').textContent=(i+1)+' / '+SLIDES.length;document.querySelector('#edit').href=SLIDES[i].file;document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===SLIDES.length-1}function key(e){if(e.target.tagName==='SELECT')return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(i+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}if(e.key==='Escape')document.body.classList.remove('tv');if(e.key==='Home')show(0);if(e.key==='End')show(SLIDES.length-1)}document.addEventListener('keydown',key);frame.onload=()=>{try{frame.contentDocument.addEventListener('keydown',key)}catch(e){}};jump.onchange=()=>show(+jump.value);document.querySelector('#prev').onclick=()=>show(i-1);document.querySelector('#next').onclick=()=>show(i+1);document.querySelector('#tv').onclick=async()=>{document.body.classList.add('tv');try{await document.documentElement.requestFullscreen?.()}catch(e){}};document.querySelector('#exit').onclick=()=>document.body.classList.remove('tv');show(0);</script></body></html>
