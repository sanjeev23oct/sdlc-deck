<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI SDLC in Bhati</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#fff;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;pointer-events:none}
nav{position:fixed;right:12px;bottom:12px;display:flex;gap:10px;align-items:center;padding:8px 12px;background:#1d2d3bee;border-radius:8px;color:#fff;font:16px Arial,sans-serif;opacity:0;transition:opacity .2s}
nav.on{opacity:1}button{font:inherit;color:#fff;background:#31475a;border:0;border-radius:4px;padding:6px 14px;cursor:pointer}
</style></head><body>
<iframe id="frame" title="Slide"></iframe>
<nav id="nav"><button id="prev">‹ Prev</button><span id="count"></span><button id="next">Next ›</button><button id="full">Fullscreen (F)</button></nav>
<script src="slides.js"></script>
<script>
const frame=document.getElementById('frame'),nav=document.getElementById('nav');let i=0,timer;
function show(n){i=Math.max(0,Math.min(SLIDES.length-1,n));frame.src=SLIDES[i].file;document.title=SLIDES[i].title;document.getElementById('count').textContent=(i+1)+' / '+SLIDES.length;location.hash=i+1}
function full(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}
function wake(){nav.classList.add('on');clearTimeout(timer);timer=setTimeout(()=>nav.classList.remove('on'),2500)}
function key(e){if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(i+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}if(e.key==='Home')show(0);if(e.key==='End')show(SLIDES.length-1);if(e.key==='f'||e.key==='F')full()}
document.addEventListener('keydown',key);document.addEventListener('mousemove',wake);
// The iframe ignores the pointer, so keys and mouse movement always reach this page, even on file://.
document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);document.getElementById('full').onclick=full;
show((parseInt(location.hash.slice(1))||1)-1);wake();
</script></body></html>
