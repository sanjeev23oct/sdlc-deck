<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 2</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../quiz.css">
</head><body>
<section class="slide"><div class="canvas">
  <header class="band"><div class="kicker">Quiz · 2 of 6 · Data analysis</div><h1 class="q">What is the safe way to get help?</h1></header>
  <p class="situation">Monthly report totals look wrong. The table holds 50,000 sangat records.</p>
  <div class="body">
    <div class="opts" data-quiz="data-analysis">
      <button type="button" class="opt"><i>A</i><span>Export the table to CSV and attach it</span></button>
      <button type="button" class="opt"><i>B</i><span>Paste the first 100 rows as a sample</span></button>
      <button type="button" class="opt" data-correct><i>C</i><span>Share the schema, let the agent write the SQL, and run it yourself</span></button>
      <button type="button" class="opt"><i>D</i><span>Give the agent the database connection string</span></button>
    </div>
    <p class="hint">Click an answer, or press 1 to 4.</p>
  </div>
  <div class="control why"><small>Answer</small><span>Bring the agent to the query, not the data to the agent. Real rows stay with you.</span></div>
</div></section>
<script src="../quiz.js"></script>
</body></html>
