<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 3</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../quiz.css">
</head><body>
<section class="slide"><div class="canvas">
  <header class="band"><div class="kicker">Quiz · 3 of 13 · Skills and agents</div><h1 class="q">What do you do?</h1></header>
  <p class="situation">You find a popular skill on GitHub with thousands of stars that would save your team hours.</p>
  <div class="body">
    <div class="opts" data-quiz="skills">
      <button type="button" class="opt"><i>A</i><span>Install it. Popular means safe</span></button>
      <button type="button" class="opt"><i>B</i><span>Try it on your laptop first, then decide</span></button>
      <button type="button" class="opt" data-correct><i>C</i><span>Raise a request so InfoSec (Deepak Yadav Ji&#x27;s team) reviews it first</span></button>
      <button type="button" class="opt"><i>D</i><span>Copy its text into a new skill of your own</span></button>
    </div>
    <p class="hint">Click an answer, or press 1 to 4.</p>
  </div>
  <div class="control why"><small>Answer</small><span>A skill runs with your access. Stars are not a review, and copying the text skips the review too.</span></div>
</div></section>
