<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 9</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../quiz.css">
</head><body>
<section class="slide"><div class="canvas">
  <header class="band"><div class="kicker">Quiz · 9 of 13 · Connection strings</div><h1 class="q">How do you ask for help?</h1></header>
  <p class="situation">The app cannot connect to the database and you want the agent&#x27;s help with the error.</p>
  <div class="body">
    <div class="opts" data-quiz="connection-string">
      <button type="button" class="opt"><i>A</i><span>Paste the full connection string so it sees everything</span></button>
      <button type="button" class="opt" data-correct><i>B</i><span>Share the error and the string with host, user and password replaced by placeholders</span></button>
      <button type="button" class="opt"><i>C</i><span>Paste it, then ask the agent to forget it</span></button>
      <button type="button" class="opt"><i>D</i><span>Send a screenshot instead of text</span></button>
    </div>
    <p class="hint">Click an answer, or press 1 to 4.</p>
  </div>
  <div class="control why"><small>Answer</small><span>Hosts, user names and passwords are all sensitive. The error and the shape of the string are enough to debug.</span></div>
</div></section>
<script src="../quiz.js"></script>
</body></html>
