<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 13</title>

<section class="slide"><div class="canvas">
  <header class="band"><div class="kicker">Quiz · 13 of 13 · Auto mode</div><h1 class="q">What do you do?</h1></header>
  <p class="situation">The approval prompts slow you down. A colleague says: turn on auto mode, or skip permissions altogether.</p>
  <div class="body">
    <div class="opts" data-quiz="auto-mode">
      <button type="button" class="opt"><i>A</i><span>Skip permissions. It is faster</span></button>
      <button type="button" class="opt" data-correct><i>B</i><span>Use auto mode with the team&#x27;s deny rules in place. Never skip permissions</span></button>
      <button type="button" class="opt"><i>C</i><span>Turn on auto mode on the production server</span></button>
      <button type="button" class="opt"><i>D</i><span>Run the agent as admin so it stops asking</span></button>
    </div>
    <p class="hint">Click an answer, or press 1 to 4.</p>
  </div>
  <div class="control why"><small>Answer</small><span>Auto mode still checks each action and keeps the deny rules. Skipping permissions removes every safeguard.</span></div>
</div></section>
