<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 6</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../quiz.css">
</head><body>
<section class="slide"><div class="canvas">
  <header class="band"><div class="kicker">Quiz · 6 of 6 · Secrets</div><h1 class="q">What do you do?</h1></header>
  <p class="situation">A .env file with the database password sits in the repo. The agent asks to read it to understand the config.</p>
  <div class="body">
    <div class="opts" data-quiz="secrets">
      <button type="button" class="opt"><i>A</i><span>Allow it. It is only on your machine</span></button>
      <button type="button" class="opt"><i>B</i><span>Allow it once, then delete the chat</span></button>
      <button type="button" class="opt" data-correct><i>C</i><span>Refuse. Move the secret to a vault and keep .env blocked</span></button>
      <button type="button" class="opt"><i>D</i><span>Paste the password yourself to save time</span></button>
    </div>
    <p class="hint">Click an answer, or press 1 to 4.</p>
  </div>
  <div class="control why"><small>Answer</small><span>Anything the agent reads leaves your machine. Secrets live in a vault, never in the repo.</span></div>
</div></section>
<script src="../quiz.js"></script>
</body></html>
