<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz 11</title>
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../quiz.css">
</head><body>
<section class="slide"><div class="canvas">
  <header class="band"><div class="kicker">Quiz · 11 of 13 · Approval prompts</div><h1 class="q">What do you do?</h1></header>
  <p class="situation">The agent asks to run a command you don&#x27;t recognise: a long curl that pipes a script into bash.</p>
  <div class="body">
    <div class="opts" data-quiz="approvals">
      <button type="button" class="opt"><i>A</i><span>Approve. The agent knows what it is doing</span></button>
      <button type="button" class="opt"><i>B</i><span>Approve and choose “don&#x27;t ask again”</span></button>
      <button type="button" class="opt" data-correct><i>C</i><span>Deny, and ask the agent to explain what it wants to do</span></button>
      <button type="button" class="opt"><i>D</i><span>Approve, then check the result</span></button>
    </div>
    <p class="hint">Click an answer, or press 1 to 4.</p>
  </div>
  <div class="control why"><small>Answer</small><span>The approval prompt is your control. If you cannot explain the command, don&#x27;t run it.</span></div>
</div></section>
<script src="../quiz.js"></script>
</body></html>
